[package]
name = "rimkit"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "persistence"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
